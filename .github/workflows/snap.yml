name: Snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "snap/**"
      - "src/**"
      - "data/**"
      - "build-aux/**"
      - "Makefile"
      - ".github/workflows/snap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      HAS_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v7

      # Same setup as snapcore/action-build, plus a stopgap: Snapcraft 9.1.x
      # rejects the gnome extension on core26. The fix (canonical/snapcraft#6278,
      # commit c05aed0) ships in 9.2; until the installed Snapcraft has it, this
      # step applies that commit to the installed snap. It turns itself off as
      # soon as the channel carries the fix.
      - name: Preparar LXD e Snapcraft
        run: |
          set -euo pipefail
          [ -d /snap ] || sudo ln -s /var/lib/snapd/snap /snap
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          sudo snap install lxd || sudo snap refresh lxd
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo snap install snapcraft --classic --channel latest/edge
          snapcraft --version

          rev=$(snap list snapcraft | awk 'NR == 2 { print $3 }')
          work=$(mktemp -d)
          sudo unsquashfs -q -d "$work/snapcraft" "/var/lib/snapd/snaps/snapcraft_${rev}.snap"

          gnome_py=$(find "$work/snapcraft" -path '*/snapcraft/extensions/gnome.py' -print -quit)
          if [ -n "$gnome_py" ] && grep -q '"core26": "gnome-core26-sdk"' "$gnome_py"; then
            echo "Snapcraft já suporta core26 na extensão gnome."
            sudo rm -rf "$work"
            exit 0
          fi

          echo "Aplicando canonical/snapcraft#6278 ao Snapcraft instalado."
          fix=https://raw.githubusercontent.com/canonical/snapcraft/c05aed0c1328725c0c4da8534151b37720bd67a8
          pkg=$(dirname "$(dirname "$gnome_py")")
          sudo curl -fsSL -o "$pkg/extensions/gnome.py" "$fix/snapcraft/extensions/gnome.py"
          sudo curl -fsSL -o "$pkg/parts/desktop_file.py" "$fix/snapcraft/parts/desktop_file.py"
          sudo find "$pkg/extensions/__pycache__" "$pkg/parts/__pycache__" \
            \( -name 'gnome.*.pyc' -o -name 'desktop_file.*.pyc' \) -delete 2>/dev/null || true
          makefile=$(find "$work/snapcraft/share" -path '*/extensions/desktop/command-chain/Makefile' -print -quit 2>/dev/null || true)
          [ -z "$makefile" ] || grep -q '^.NOTPARALLEL:' "$makefile" || echo '.NOTPARALLEL:' | sudo tee -a "$makefile" >/dev/null
          sudo snap pack "$work/snapcraft" "$work"
          sudo snap install --dangerous --classic "$work"/snapcraft_*.snap
          sudo rm -rf "$work"
          snapcraft --version

      - name: Gerar o snap
        id: build
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: lxd
        run: |
          set -euo pipefail
          # New login so the lxd group membership applies.
          sudo -u "$USER" -E snapcraft pack --verbose
          snap=$(ls -1 dotdeck_*.snap | head -n1)
          echo "snap=$PWD/$snap" >> "$GITHUB_OUTPUT"

      - name: Verificar o snap
        run: |
          set -euo pipefail
          [ -d /snap ] || sudo ln -s /var/lib/snapd/snap /snap
          sudo snap install gnome-core26 gtk-common-themes mesa-2604
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect dotdeck:gnome-core26 gnome-core26
          sudo snap connect dotdeck:gpu-2604 mesa-2604:gpu-2604 || true
          test -f /snap/dotdeck/current/meta/gui/dotdeck.desktop \
            || test -f /snap/dotdeck/current/usr/share/applications/io.github.euvinicios.Dotdeck.desktop \
            || find /snap/dotdeck /var/lib/snapd/snap/dotdeck -name "*.desktop" 2>/dev/null | grep -q "desktop"
          # Python, GTK 4, WebKitGTK 6 and the WebRTC plugins resolve inside the sandbox.
          timeout 120 snap run dotdeck --version | tee version.txt
          grep -q "^Dotdeck " version.txt
          timeout 120 snap run dotdeck --self-test | tee self-test.json
          grep -q '"voice_engine": "ready"' self-test.json
          grep -q '"sandbox": "snap"' self-test.json

      # What the store hands to a stranger: the same scan as the source tree (make privacy),
      # on every file of the built snap.
      - name: Privacidade do snap (nenhum segredo nem endereço privado no pacote)
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dotdeck-snap"
          sudo unsquashfs -q -f -d "$root" "${{ steps.build.outputs.snap }}"
          sudo chmod -R a+rX "$root"
          python3 tools/privacy_scan.py "$root"

      # Inside the snap the app must not try to own its id on D-Bus (that needs a dbus
      # slot and a manual store review): it runs non-unique (src/core/instance.py).
      - name: O snap não depende de nome no D-Bus
        run: |
          ! grep -q "interface: dbus" /snap/dotdeck/current/meta/snap.yaml
          grep -q "Gio.ApplicationFlags.NON_UNIQUE" /snap/dotdeck/current/usr/share/dotdeck/dotdeck/main.py

      - uses: actions/upload-artifact@v7
        with:
          name: dotdeck-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      # main -> edge, tags v* -> stable (the tags come from the Lançamento workflow, once
      # CI passed; the snap only gets here after installing and passing its self-test
      # above). Needs the SNAPCRAFT_STORE_CREDENTIALS secret: see
      # docs/publicar-na-central-de-apps.md.
      - name: Publicar na Snap Store
        if: github.event_name == 'push' && env.HAS_STORE_CREDENTIALS == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
